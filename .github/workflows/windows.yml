name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Cache local SDK and installer tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: windows-opencv-4.10.0-inno-6.2.2-v1
      - name: Extract pinned dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -OpenCV -Installer
      - name: Format
        run: cargo fmt --all -- --check
      - name: Validate package and release metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/validate-release.ps1 -Tag $env:GITHUB_REF_NAME -RequireMain -NotesPath "$env:RUNNER_TEMP/release-notes.md"
          } else {
            ./scripts/validate-release.ps1
          }
      - name: Lint
        shell: pwsh
        run: |
          . ./scripts/build-env.ps1
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Verify updater installation, cancellation and recovery
        shell: powershell
        run: ./scripts/test-update-helper.ps1
      - name: Verify UIAccess installer failure and launch handling
        shell: powershell
        run: ./scripts/test-uiaccess-installer.ps1
      - name: Package installer and portable application
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robocam-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: robocam-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Verify complete release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test -f "dist/robocam-$version-windows-x64-setup.exe"
          test -f "dist/robocam-$version-windows-x64.zip"
          test -f "dist/robocam-$version-source.zip"
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Publish stable release after uploading all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --json isDraft > existing-release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing-release.json)" != true ]; then
              echo 'Refusing to modify a published release.'
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --target "$COMMIT" --title "$TAG" --notes-file notes/release-notes.md
          fi
          gh release edit "$TAG" --notes-file notes/release-notes.md
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 4
          gh release edit "$TAG" --draft=false --latest
