name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Cache local SDK and installer tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: windows-opencv-4.10.0-inno-6.2.2-v1
      - name: Extract pinned dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -OpenCV -Installer
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        shell: pwsh
        run: |
          . ./scripts/build-env.ps1
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Package installer and portable application
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robocam-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
